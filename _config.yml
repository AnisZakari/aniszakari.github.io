# Site Settings
title: "The AI Engineering Quest"
description: "Personal blog about data science, machine learning, and AI Engineering"
url: "https://aniszakari.github.io"  
baseurl: ""  

# Repository (optional - for GitHub edit links)
# repository: YOUR_USERNAME/personal-blog  # Uncomment and update when ready

# Theme
remote_theme: mmistakes/minimal-mistakes@4.24.0
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate

# Author
author:
  name: "Anis Zakari"
  avatar: "/assets/media-export-203664368-from-0-to-2031/2022/03/anis_rond.png"
  bio: "I used to be a Data Scientist in NLP. I used to be an ML Engineer. Now I'm a Lead AI Engineer, and I make AI chatbots for a living."  # Optional bio
  location: # Optional location
  email: "anis.zakari@outlook.fr"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/AnisZakari"  

# Language
lang: en

# Timezone
timezone: Europe/Paris  # Update to your timezone

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
  - ARTICLE_CHECK_REPORT.md
  - _attachments
  - _wp_global_styless
  - _wp_navigations
  - _nav_menu_items

# Collections
collections:
  pages:
    output: true

# Permalinks
permalink: /:year/:month/:day/:title/

# Pagination
paginate: 15
paginate_path: "/page:num/"

# Footer settings
footer:
  custom_text: "Made with ❤️ by Anis Zakari" 

# Minimal Mistakes specific settings
search: true
search_provider: "lunr"  # "lunr", "algolia", or "google"
lunr:
  search_within_pages: true
  search_full_content: false  # Set to true if you want to search full content (larger index)
minimal_mistakes_skin: default  # "air", "aqua", "contrast", "dark", "dirt", "neon", "sunrise"

# Sidebar settings
sidebar:
  - title: "About"
    image: "/assets/media-export-203664368-from-0-to-2031/2022/03/anis_rond.png"
    image_alt: "Anis Zakari"
    text: "Lead AI Engineer, writing about AI Engineering, machine learning, and Data science."

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false  # Disable until you set up comments
      share: true
      related: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      prev: false
      next: false
      related: false
  - scope:
      path: "assets/js/lunr"
    values:
      layout: none
